name: BrickLink public access test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-public-price-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public Price Guide access (no credentials)
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.error

          urls = {
              "LEGO set 10326": "https://www.bricklink.com/catalogPG.asp?S=10326-1&v=P&prDec=2",
              "Minifigure twn486": "https://www.bricklink.com/catalogPG.asp?M=twn486&v=P&prDec=2",
          }
          blocked = False
          for label, url in urls.items():
              print(f"\n--- {label} ---")
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (compatible; BrickLinkPriceGuideHelper/0.2)",
                      "Accept-Language": "en-US,en;q=0.9",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read().decode("utf-8", errors="replace")
                      low = body.lower()
                      challenge = any(term in low for term in (
                          "verify that you're not a robot",
                          "enable javascript and then reload",
                          "aws-waf",
                          "captcha",
                      ))
                      print(f"HTTP: {response.status}")
                      print(f"HTML bytes: {len(body)}")
                      print(f"Page title: {body.split('<title>', 1)[-1].split('</title>', 1)[0][:160] if '<title>' in low else '(no title tag found)'}")
                      print(f"Anti-bot challenge detected: {'YES' if challenge else 'not detected'}")
                      if response.status != 200 or challenge or len(body) < 1000:
                          blocked = True
              except urllib.error.HTTPError as exc:
                  print(f"HTTP error: {exc.code}")
                  blocked = True
              except Exception as exc:
                  print(f"Request failed: {type(exc).__name__}: {exc}")
                  blocked = True
          if blocked:
              print("\nRESULT: public access is blocked or inconclusive; do not deploy the scraper as working.")
          else:
              print("\nRESULT: pages are reachable, but price parsing still needs validation.")
          PY
